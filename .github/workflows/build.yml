
name: Build ResinSMPAbilityHeads

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source ZIP
        run: |
          unzip -q ResinSMPAbilityHeads-textures-source.zip -d source

      - name: Build plugin JAR
        run: |
          gradle -p source/ResinSMPAbilityHeads --no-daemon clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ResinSMPAbilityHeads-1.0.0
          path: source/ResinSMPAbilityHeads/build/libs/ResinSMPAbilityHeads-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
          
